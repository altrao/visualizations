<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Visualizer</title>
<style>
  :root { color-scheme: dark; --panel: #16181dd9; --fg: #e6e8ee; --muted: #9aa3b2; --accent: #4fa3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; top: 12px; left: 12px; right: 12px; max-width: 760px; background: var(--panel);
           backdrop-filter: blur(8px); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; z-index: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label { color: var(--muted); }
  select, button, input[type=file] { font: inherit; color: var(--fg); background: #262a33; border: 1px solid #3a404c;
           border-radius: 6px; padding: 5px 8px; max-width: 100%; }
  button:hover, select:hover { border-color: var(--accent); }
  audio { width: 100%; height: 32px; }
  #status { color: var(--muted); font-size: 12px; min-height: 1em; }
  .hidden { display: none !important; }
  #panel { padding-right: 44px; }
  #preset { width: 9.5em; } /* fixed so long Battery names don't wrap the row; the open list shows them in full */
  #min { position: absolute; top: 8px; right: 8px; line-height: 1; }
  #panel.min { right: auto; padding: 6px; }
  #panel.min > :not(#min) { display: none; }
  #panel.min #min { position: static; }
</style>
</head>
<body>
<canvas id="c2d"></canvas>
<canvas id="cgl" class="hidden"></canvas>

<div id="panel">
  <button id="min" title="Minimize panel (H hides it completely)" aria-label="Minimize panel" aria-expanded="true">–</button>
  <div class="row">
    <label>Source <select id="mode">
      <option value="A">A · Play a file here</option>
      <option value="B">B · Visualize what this computer is playing</option>
    </select></label>
    <label>Effect <select id="effect">
      <option value="alchemy">Alchemy</option>
      <option value="battery">Battery</option>
      <option value="tolerance">Tolerance</option>
      <option value="ambience">Ambience</option>
      <option value="bars">Bars</option>
      <option value="scope">Scope</option>
    </select></label>
    <label id="presetWrap" class="hidden">Preset <select id="preset"></select></label>
  </div>
  <div id="modeA" class="row">
    <input type="file" id="file" accept="audio/*">
    <label>Play file on <select id="outDev"></select></label>
    <button id="unlock" title="Browsers hide device names until a microphone permission is granted">Show device names</button>
    <audio id="audio" controls></audio>
  </div>
  <div id="modeB" class="row hidden">
    <label>Loopback input <select id="inDev"></select></label>
    <button id="capture">Capture input</button>
    <button id="share">Share screen + system audio</button>
    <button id="stop">Stop</button>
  </div>
  <div id="status"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const status = msg => { $('status').textContent = msg; };
const md = navigator.mediaDevices;
const canSink = 'setSinkId' in AudioContext.prototype;

// ---------- audio graph ----------
let ctx, analyser, mediaSrc, aAttached = false, capSrc, capStream;
let freq = new Uint8Array(1024), wave = new Uint8Array(2048).fill(128);

function audio() { // created lazily: browsers only allow audio after a user gesture
  if (!ctx) {
    ctx = new AudioContext();
    analyser = Object.assign(ctx.createAnalyser(), { fftSize: 2048, smoothingTimeConstant: 0.75 });
    const mute = ctx.createGain();
    mute.gain.value = 0;
    analyser.connect(mute).connect(ctx.destination); // keeps the analyser processing without making it audible
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    buildBars(ctx.sampleRate, analyser.frequencyBinCount);
    applySink();
  }
  ctx.resume();
  return ctx;
}

function attachA() {
  audio();
  stopCapture();
  if (!mediaSrc) {
    mediaSrc = ctx.createMediaElementSource($('audio')); // from now on the element plays through ctx (and its sink)
    mediaSrc.connect(ctx.destination);
  }
  if (!aAttached) { mediaSrc.connect(analyser); aAttached = true; }
}

function detachA() {
  $('audio').pause();
  if (aAttached) { mediaSrc.disconnect(analyser); aAttached = false; }
}

function stopCapture() {
  capStream?.getTracks().forEach(t => t.stop());
  capSrc?.disconnect();
  capStream = capSrc = null;
}

async function startCapture(getStream, what) {
  audio();
  try {
    const s = await getStream();
    if (!s.getAudioTracks().length) {
      s.getTracks().forEach(t => t.stop());
      throw new Error('no audio was shared. In the picker choose "Entire screen" and switch on "Also share system audio".');
    }
    stopCapture();
    detachA();
    capStream = s;
    capSrc = ctx.createMediaStreamSource(s);
    capSrc.connect(analyser); // not to the destination: you would hear it twice or get feedback
    s.getTracks().forEach(t => t.onended = () => { if (capStream === s) { stopCapture(); status('Capture ended.'); } });
    status(`Capturing: ${what}`);
    listDevices(); // labels become visible once permission is granted
  } catch (e) {
    status(`Capture failed: ${e.message}`);
  }
}

// ---------- devices ----------
async function listDevices() {
  if (!md) return status('Device access needs https or http://localhost.');
  const devs = await md.enumerateDevices();
  fill($('outDev'), devs.filter(d => d.kind === 'audiooutput'), 'Default output');
  fill($('inDev'), devs.filter(d => d.kind === 'audioinput'), 'Default input');
}

function fill(sel, devs, fallback) {
  const keep = sel.value;
  const opts = devs.map((d, i) => new Option(d.label || (d.deviceId && devs.length > 1 ? `${fallback.split(' ')[1]} ${i + 1}` : fallback), d.deviceId));
  sel.replaceChildren(...(opts.length ? opts : [new Option(fallback, '')]));
  if (opts.some(o => o.value === keep)) sel.value = keep;
}

async function applySink() {
  if (!ctx || !canSink) return;
  const id = $('outDev').value;
  try {
    await ctx.setSinkId(id === 'default' ? '' : id);
    status(`Output: ${$('outDev').selectedOptions[0]?.text}`);
  } catch (e) {
    status(`Could not switch output: ${e.message}`);
  }
}

// ---------- UI ----------
$('mode').onchange = () => {
  const b = $('mode').value === 'B';
  $('modeA').classList.toggle('hidden', b);
  $('modeB').classList.toggle('hidden', !b);
  if (b) { detachA(); status('Click "Share screen + system audio", choose "Entire screen" and switch on "Also share system audio". Or capture a loopback input (Stereo Mix, VB-Cable, "Monitor of …").'); }
  else { stopCapture(); status('Pick an audio file.'); }
};

$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  const el = $('audio');
  if (el.src) URL.revokeObjectURL(el.src);
  el.src = URL.createObjectURL(f);
  attachA();
  el.play().catch(e => status(`Playback failed: ${e.message}`));
};
$('audio').onplay = attachA;
$('outDev').onchange = () => { audio(); applySink(); };

$('unlock').onclick = async () => {
  try {
    (await md.getUserMedia({ audio: true })).getTracks().forEach(t => t.stop());
    await listDevices();
    status('Device names visible.');
  } catch (e) {
    status(`Permission denied: ${e.message}`);
  }
};

$('capture').onclick = () => {
  const id = $('inDev').value;
  startCapture(() => md.getUserMedia({ audio: {
    deviceId: id ? { exact: id } : undefined,
    echoCancellation: false, noiseSuppression: false, autoGainControl: false, // voice processing mangles music
  } }), $('inDev').selectedOptions[0]?.text);
};
$('share').onclick = () => {
  if (!md?.getDisplayMedia) return status('This browser cannot capture tab/system audio.');
  // video is required by Chrome's picker; we only read the audio track
  startCapture(() => md.getDisplayMedia({ video: { displaySurface: 'monitor' }, systemAudio: 'include', // 'monitor' opens the Entire screen tab, the only one with system audio
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }), 'shared tab/screen audio');
};
$('min').onclick = () => {
  const min = $('panel').classList.toggle('min');
  Object.assign($('min'), { textContent: min ? '☰' : '–', title: min ? 'Show panel' : 'Minimize panel (H hides it completely)' });
  $('min').setAttribute('aria-label', min ? 'Show panel' : 'Minimize panel');
  $('min').setAttribute('aria-expanded', !min);
};
$('stop').onclick = () => { stopCapture(); status('Stopped.'); };

const TOL_PRESETS = ['Blur', 'SwitchBlur', 'Shift', 'Linear Shift', 'Stretch Shift', 'SuperStar', 'WonderWave', "Shift O' Scope", 'Funktional', 'Bass Bounce'];
$('preset').onchange = () => {
  if ($('effect').value === 'battery') BAT.sim?.load(BAT_PRESETS[$('preset').value - 1] ?? null);
  else clearFeedback();
};

const effects = ['alchemy', 'battery', 'tolerance', 'ambience', 'bars', 'scope'];
$('effect').onchange = () => {
  const fx = $('effect').value, webgl = fx === 'ambience' || fx === 'tolerance';
  $('cgl').classList.toggle('hidden', !webgl);
  $('c2d').classList.toggle('hidden', webgl);
  $('presetWrap').classList.toggle('hidden', fx !== 'tolerance' && fx !== 'battery');
  const names = fx === 'battery' ? ['Randomisation', ...BAT_PRESETS.map(p => p[0])] : TOL_PRESETS;
  if ($('preset').dataset.fx !== fx) {
    $('preset').replaceChildren(...names.map((n, i) => new Option(n, i)));
    $('preset').dataset.fx = fx;
    if (fx === 'battery') BAT.sim?.load(null);
  }
  clearFeedback(); // the WebGL effects store different data in the shared buffers
  g.fillStyle = '#000'; // scope only fades the canvas, so wipe what the previous effect drew
  g.fillRect(0, 0, W, H);
};
addEventListener('keydown', e => {
  if (e.target.closest('select, input, audio')) return;
  if (effects[e.key - 1]) { $('effect').value = effects[e.key - 1]; $('effect').onchange(); }
  if (e.key === 'h') $('panel').classList.toggle('hidden');
  if (e.key === 'n') ALC.sim?.next(); // Alchemy: change the warp now
  if (e.key === 'f') toggleFs();
});
const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('dblclick', e => { if (!e.target.closest('#panel')) toggleFs(); });

// ---------- bars + scope (canvas 2D) ----------
const c2d = $('c2d'), g = c2d.getContext('2d'), cgl = $('cgl');
let W = 0, H = 0, dpr = 1;

const NBARS = 64;
let bars = [];
const peaks = new Float32Array(NBARS), peakV = new Float32Array(NBARS);

function buildBars(rate, bins) { // log-spaced bands, 40 Hz .. 16 kHz, each at least one FFT bin
  const lo = 40, hi = Math.min(16000, rate / 2), hz = rate / 2 / bins;
  bars = [];
  for (let i = 0; i < NBARS; i++) {
    const a = Math.floor(lo * (hi / lo) ** (i / NBARS) / hz);
    const b = Math.max(a + 1, Math.ceil(lo * (hi / lo) ** ((i + 1) / NBARS) / hz));
    bars.push([a, Math.min(b, bins)]);
  }
  console.assert(bars.every(([a, b]) => a < b && b <= bins), 'bad bar ranges', bars);
}
buildBars(48000, 1024);

const levels = new Float32Array(NBARS);
function bandLevels() { // 0..1 per log-spaced band
  for (let i = 0; i < NBARS; i++) {
    const [a, b] = bars[i];
    let v = 0;
    for (let k = a; k < b; k++) v = Math.max(v, freq[k]);
    levels[i] = v / 255;
  }
  return levels;
}

function drawBars(dt) {
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  const slot = W / NBARS, bw = slot * 0.82;
  const grad = g.createLinearGradient(0, H, 0, H * 0.1);
  grad.addColorStop(0, '#0b2cff'); grad.addColorStop(0.55, '#00c8ff'); grad.addColorStop(1, '#e8fbff');
  const lv = bandLevels();
  for (let i = 0; i < NBARS; i++) {
    const h = lv[i] * H * 0.85, x = i * slot + (slot - bw) / 2;
    g.fillStyle = grad;
    g.fillRect(x, H - h, bw, h);
    if (h >= peaks[i]) { peaks[i] = h; peakV[i] = 0; }
    else { peakV[i] += H * 1.5 * dt; peaks[i] = Math.max(h, peaks[i] - peakV[i] * dt); } // caps fall with gravity
    g.fillStyle = '#fff';
    g.fillRect(x, H - peaks[i] - 4 * dpr, bw, 3 * dpr);
  }
}

function drawScope(t) {
  g.fillStyle = 'rgba(0,0,0,0.25)'; // partial clear leaves short trails
  g.fillRect(0, 0, W, H);
  const color = `hsl(${(t * 25) % 360} 100% 60%)`;
  g.lineWidth = 2 * dpr; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 12 * dpr;
  g.beginPath();
  for (let i = 0; i < wave.length; i++) {
    const x = (i / (wave.length - 1)) * W, y = H / 2 + ((wave[i] - 128) / 128) * H * 0.4;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  g.shadowBlur = 0;
}

// ---------- alchemy (CPU simulation of the original's behaviour; see ALCHEMY.md) ----------
// One 384×288 XRGB image is the whole state: each tick it is copied through the Composite warp's remap table, then the
// drawing effects plot waveform lines and balls onto it. Nothing fades it. Hover only zooms what is shown.
function makeAlchemy(W = 384, H = 288) {
  const N = W * H, PI = Math.PI, tr = Math.trunc;
  const rnd = v => v <= 0 ? tr(v - .5) : tr(v + .5);            // the original's round-half-away
  const ri = n => Math.random() * n | 0;                         // rand() % n
  const rint = (a, b) => a + ri(b - a + 1);                      // inclusive
  const rf = (a, b) => a + Math.random() * (b - a);
  const minOf = (k, a, b) => { let m = b; while (k--) m = Math.min(m, rint(a, b)); return m; };
  let img = new Uint32Array(N).fill(0xff000000), tmp = new Uint32Array(N);
  const opt = { blur: true, flag48: false };                     // test switches; keep the defaults
  const A = { f: null, w: null, bass: 0, treble: 0, beat: false, drop: false };

  // colours: 0xRRGGBB ints; pixels are little-endian ABGR
  const rgb = p => (p & 255) << 16 | p & 0xff00 | p >> 16 & 255;
  const px = c => 0xff000000 | (c & 255) << 16 | c & 0xff00 | c >> 16 & 255;
  const lerpC = (a, b, t) => {                                   // a + (b − a)·t per channel
    const ch = s => { const x = a >> s & 255; return x + rnd(((b >> s & 255) - x) * t) & 255; };
    return ch(16) << 16 | ch(8) << 8 | ch(0);
  };
  const randCol = () => Math.random() * 0xffffff | 0;
  const cset = (s, a, b, T, mult) => {
    if (T <= 0) T = ri(100) + 1;
    s.f = 0; s.mult = mult; s.bounce = mult > 1; s.T = mult > 1 ? T / mult | 0 : T; s.cur = s.a = a; s.b = b;
  };
  const cslot = () => { const s = { a: randCol(), b: randCol(), f: 0, T: 0, mult: 1, bounce: false }; s.cur = s.a; return s; };
  const cstep = s => {                                           // ease a→b over T steps, then bounce or pick anew
    if (++s.f <= s.T) s.cur = lerpC(s.a, s.b, Math.sin(s.f / s.T * PI / 2));
    else if (s.bounce) cset(s, s.b, s.a, s.T * s.mult, s.mult);
    else cset(s, s.cur, randCol(), ri(100), 1);
  };

  // ---- pen: waveform-wobbled lines ----
  const pen = () => ({ mode: 0, alpha: .1, samples: 100, amp: 50, env: 0, loops: 2, mirror: false, m: 0, g: cslot(), c: 0 });
  const penSet = (p, ca, cb, k, mode, alpha, samples, amp, env, loops) => {
    cset(p.g, ca, cb, 1, k);
    p.k = k; p.mode = mode; p.alpha = alpha; p.samples = samples; p.amp = amp; p.env = env; p.loops = loops;
    if (mode < 3) p.m = [0, 1, 9][mode];                         // clip margin; mode 3 keeps the last one
  };
  const plot = (p, x, y) => {
    if (x < 1 || y < 1 || x > W - 2 || y > H - 2) return;
    const i = y * W + x, c = p.c;
    if (p.mode === 0) { img[i] = px(lerpC(c, rgb(img[i]), .9)); return; }
    const t = p.mode === 1 ? .3 : p.alpha;
    img[i] = px(c);
    for (const j of [i + 1, i - 1, i + W, i - W]) img[j] = px(lerpC(c, rgb(img[j]), t));
  };
  const seg = (p, x0, y0, x1, y1) => {                           // Bresenham, end point excluded, clipped to the margin
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x1 < x0 ? -1 : 1, sy = y1 < y0 ? -1 : 1;
    const n = Math.max(dx, dy), m = p.m;
    if (n > 4 * (W + H)) return;                                 // shortcut: absurd segments are dropped, not clipped
    let e = 0;
    for (let s = 0; s < n; s++) {
      if (x0 >= m && y0 >= m && x0 < W - m && y0 < H - m) plot(p, x0, y0);
      if (dx > dy) { x0 += sx; if ((e += dy) > dx) { e -= dx; y0 += sy; } }
      else { y0 += sy; if ((e += dx) > dy) { e -= dy; x0 += sx; } }
    }
  };
  const level = (p, i, n) => {
    const h = n >> 1, j = i > h ? 2 * h - i : i;                 // folded: the trace is symmetric about its middle
    let v = p.amp / 128 * ((A.w[j] ?? 128) - 128);
    if (p.env === 0) v *= Math.abs(Math.sin(i / n * p.loops * PI));
    else if (p.env === 1) v *= (i >= h ? 2 * h - i : i) / h;
    return v;
  };
  const line = (p, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay, n = Math.min(p.samples, Math.max(Math.abs(dx), Math.abs(dy)) + 1);
    const a = Math.atan2(dy, dx) + PI / 2, c = Math.cos(a), s = Math.sin(a);
    p.g.T = Math.max(1, n / p.k | 0); p.g.f = 0; p.g.cur = p.g.a; // the gradient bounces k times along the line
    let l = level(p, 0, n), x = rnd(ax + c * l), y = rnd(ay + s * l), mx = rnd(ax - c * l), my = rnd(ay - s * l);
    for (let i = 1; i < n; i++) {
      p.c = p.g.cur; cstep(p.g);
      const t = i / n, cx = dx * t + ax, cy = dy * t + ay;
      l = level(p, i, n);
      const x1 = rnd(cx + c * l), y1 = rnd(cy + s * l);
      seg(p, x, y, x1, y1); x = x1; y = y1;
      if (p.mirror) { const x2 = rnd(cx - c * l), y2 = rnd(cy - s * l); seg(p, mx, my, x2, y2); mx = x2; my = y2; }
    }
  };
  const lineThrough = (p, cx, cy, a, len) => {
    const h = len / 2;
    line(p, cx + rnd(Math.cos(a) * h), cy + rnd(Math.sin(a) * h), cx + rnd(Math.cos(a + PI) * h), cy + rnd(Math.sin(a + PI) * h));
  };

  // ---- Composite warps: each maps a destination pixel to a source pixel, written to X, Y ----
  let X = 0, Y = 0;
  const cx0 = W >> 1, cy0 = H >> 1, halfDiag = Math.sqrt(W * W + H * H) / 2;
  function shiftWarp() {
    let dx, dy;
    do { dx = ri(7) - 3; dy = ri(7) - 3; } while (!dx && !dy);
    const st = ri(3) !== 0, s1 = rf(0, .1), s2 = rf(0, .1), edge = ri(8), wob = ri(3), k = ri(15) + 1;
    const L = x => tr((s1 + 1) * x), T = y => tr((s2 + 1) * y);
    const R = x => x - tr((s1 + 1) * (W - x - 1) - (W - x - 1)), B = y => y - tr((s2 + 1) * (H - y - 1) - (H - y - 1));
    return { keep: false, comb: true, refl: false, map(x, y) {
      if (st) {
        if (edge === 0) x = L(x); else if (edge === 1) y = T(y); else if (edge === 2) x = R(x); else if (edge === 3) y = B(y);
        else if (edge === 4) { x = L(x); y = T(y); } else if (edge === 5) { x = R(x); y = B(y); }
        else if (edge === 6) { x = L(x); y = B(y); } else { x = R(x); y = T(y); }
      } else { x += dx; y += dy; }
      if (wob === 1) x += rnd(Math.sin(y / H * k * PI) * 3 * dy);
      else if (wob === 2) y += rnd(Math.sin(x / W * k * PI) * 3 * dx);
      X = x; Y = y;
    } };
  }
  function swirlWarp() {
    const sine = ri(2) === 0, k = ri(15) + 1, rot = sine ? rf(-.22, .22) : rf(-.1, .1), K = tr(H * rf(.05, .3));
    const own = ri(2) === 0, ox = tr(W * rf(.05, .95)), oy = tr(H * rf(.05, .95));
    const maxR = Math.max(Math.hypot(ox, oy), Math.hypot(W - ox, oy), Math.hypot(W - ox, H - oy), Math.hypot(ox, H - oy));
    const cx = own ? ox : cx0, cy = own ? oy : cy0;
    return { keep: true, comb: true, refl: false, map(x, y) {
      const dx = x - cx, dy = y - cy, r = Math.sqrt(dx * dx + dy * dy), q = r / maxR, r2 = r - K * q * q * q;
      const a = Math.atan2(dy, dx) + (sine ? Math.sin(k * q * PI) * rot : q * rot);
      X = cx + tr(Math.cos(a) * r2); Y = cy + tr(Math.sin(a) * r2);
    } };
  }
  function blockWarp() {
    const T = ri(40) + 1, s = ri(4) + 1, vOnly = ri(4) === 0, P = 2 * T;
    return { keep: true, comb: true, refl: false, map(x, y) {
      const bx = x % P, by = y % P;
      X = x; Y = y;
      if (vOnly) Y = bx <= T ? y - s : y + s;
      else if (by > T) { if (W - x >= T || bx <= by - T) X = x + s; else Y = y + s; }
      else if (x < T && bx > by) Y = y + s;
      else X = x - s;
    } };
  }
  function reflectWarp() {
    const mode = ri(4), sub = ri(2) === 0 ? swirlWarp() : shiftWarp(), R = ri(250) + 5, m = ri(25) + 1;
    const cell = Math.max(1, tr((cx0 - R) / m));                 // shortcut: the original divides by 0 when R >= W/2
    const mirror4 = (x, y) => {
      let f = false;
      if (x > cx0) { x = W - x; f = true; }
      if (y > cy0) { y = H - y; f = true; }
      if (f) { X = x; Y = y; } else sub.map(x, y);
    };
    return { keep: false, comb: false, refl: true, map(x, y) {

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); // NPOT textures need clamp in WebGL1
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (w) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}

function glResize() {
  cgl.width = W; cgl.height = H;
  fbos.forEach(f => { gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fb); });
  fbos = [0, 1].map(() => {
    const tex = texture(W, H), fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb };
  });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

if (gl) {
  progs = { ambience: [program(WARP_FS), program(SHOW_FS)], tolerance: [program(TOL_FS), program(TOL_SHOW_FS)] };
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); // one screen-covering triangle
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texWave = texture();
  texSpec = texture();
} else {
  for (const v of ['ambience', 'tolerance']) $('effect').querySelector(`[value=${v}]`).disabled = true;
}

function clearFeedback() {
  if (!gl) return;
  gl.clearColor(0, 0, 0, 1);
  for (const f of fbos) { gl.bindFramebuffer(gl.FRAMEBUFFER, f.fb); gl.clear(gl.COLOR_BUFFER_BIT); }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function setUniforms(p, u) { // uniforms a shader doesn't declare have no location and are skipped
  for (const [n, unit] of [['prev', 0], ['img', 0], ['wave', 1], ['spec', 2]]) { const l = loc(p, n); if (l) gl.uniform1i(l, unit); }
  for (const [n, v] of Object.entries(u)) {
    const l = loc(p, n);
    if (l) Array.isArray(v) ? gl.uniform2f(l, ...v) : gl.uniform1f(l, v);
  }
}

function upload(unit, tex, data) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (data) gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, data.length, 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, data);
}

function drawFeedback(name, u) { // pass 1: previous frame -> warped + new ink; pass 2: show it
  const [warp, show] = progs[name], src = fbos[cur], dst = fbos[cur ^= 1];
  gl.viewport(0, 0, W, H);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.useProgram(warp);
  upload(0, src.tex);
  if (loc(warp, 'wave')) upload(1, texWave, wave); // skip uploads the shader doesn't read
  if (loc(warp, 'spec')) upload(2, texSpec, freq);
  setUniforms(warp, u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(show);
  upload(0, dst.tex);
  setUniforms(show, u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------- main loop ----------
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.max(1, innerWidth * dpr | 0); H = Math.max(1, innerHeight * dpr | 0);
  c2d.width = W; c2d.height = H;
  if (gl) glResize();
}
addEventListener('resize', resize);
resize();

const band = (f0, f1) => { // mean level 0..1 of a frequency band
  const hz = (ctx?.sampleRate ?? 48000) / 2 / freq.length;
  const a = Math.floor(f0 / hz), b = Math.max(a + 1, Math.ceil(f1 / hz));
  let s = 0;
  for (let k = a; k < b; k++) s += freq[k];
  return s / (b - a) / 255;
};

let last = performance.now(), bassAvg = 0, beat = 0, flip = 1;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000;
  last = now;
  if (analyser) { analyser.getByteFrequencyData(freq); analyser.getByteTimeDomainData(wave); }
  const bass = band(20, 150), treble = band(4000, 12000);
  bassAvg += (bass - bassAvg) * 0.05;
  const hit = bass > 0.3 && bass > bassAvg * 1.3; // simple energy-spike beat detector
  if (hit && beat < 1) flip = -flip; // once per beat onset
  beat = hit ? 1 : beat * 0.9;

  const fx = $('effect').value;
  if (fx === 'ambience' || fx === 'tolerance')
    drawFeedback(fx, { res: [W, H], t, bass, treble, beat, flip, preset: +$('preset').value });
  else if (fx === 'alchemy') drawAlchemy(dt);
  else if (fx === 'battery') drawBattery(dt);
  else if (fx === 'scope') drawScope(t);
  else drawBars(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- start ----------
if (md) { listDevices(); md.addEventListener('devicechange', listDevices); }
if (!canSink) { $('outDev').disabled = true; $('outDev').title = 'Output selection for Web Audio needs Chrome/Edge 110+'; }
status(canSink ? 'Pick an audio file. Double-click or press F for fullscreen, 1-6 switch effects, N = next Alchemy warp, H hides this panel.'
               : 'This browser plays on the default output only (output picking needs Chrome/Edge). Pick an audio file.');
</script>
</body>
</html>
